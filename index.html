<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課表查詢系統 - 民雄國中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 載入中遮罩 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div>資料載入中，請稍候...</div>
    </div>

    <!-- 登入視圖 -->
    <div id="loginView" class="view-container active">
        <div class="login-card">
            <h1 class="system-title">課表查詢系統</h1>
            <p class="system-subtitle">請選擇學期並登入查詢</p>

            <div class="form-group">
                <label for="semesterSelect">學期選擇</label>
                <select id="semesterSelect" class="form-control">
                    <option value="115-1">115-1</option>
                    <option value="114-2">114-2</option>
                    <option value="114-1">114-1</option>
                </select>
            </div>

            <!-- 底部操作列：左(當月) - 中(進入按鈕) - 右(累計) -->
            <div class="login-actions">
                <div class="counter-box monthly-counter">
                    <span class="counter-label">當月瀏覽</span>
                    <span id="monthlyViews" class="counter-value">--</span>
                </div>

                <button id="loginBtn" class="btn btn-primary">進入系統</button>

                <div class="counter-box total-counter">
                    <span class="counter-label">累計瀏覽</span>
                    <span id="totalViews" class="counter-value">--</span>
                </div>
            </div>

            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <!-- 查詢視圖 (預設隱藏) -->
    <div id="queryView" class="view-container">
        <div class="query-card">
            <div class="header-bar">
                <h2>課表查詢</h2>
                <span id="currentSemesterBadge" class="semester-badge">115-1</span>
            </div>
            
            <div class="tab-header">
                <button class="tab-btn active" data-tab="class">班級課表</button>
                <button class="tab-btn" data-tab="teacher">教師課表</button>
            </div>

            <div id="classTab" class="tab-content">
                <div class="query-grid-2">
                    <div class="form-group">
                        <label class="grade-label grade-7">七年級</label>
                        <select id="grade7Select" class="form-control"><option value="">請選擇班級</option></select>
                    </div>
                    <div class="form-group">
                        <label class="grade-label grade-8">八年級</label>
                        <select id="grade8Select" class="form-control"><option value="">請選擇班級</option></select>
                    </div>
                    <div class="form-group">
                        <label class="grade-label grade-9">九年級</label>
                        <select id="grade9Select" class="form-control"><option value="">請選擇班級</option></select>
                    </div>
                    <div class="form-group">
                        <label class="grade-label grade-special">特教班</label>
                        <select id="gradeSpecSelect" class="form-control"><option value="">請選擇班級</option></select>
                    </div>
                </div>
            </div>

            <div id="teacherTab" class="tab-content hidden">
                <div class="form-group">
                    <label for="teacherSelect">選擇教師</label>
                    <select id="teacherSelect" class="form-control"><option value="">請選擇教師</option></select>
                </div>
            </div>
        </div>
    </div>

    <!-- 課表結果視圖 (預設隱藏) -->
    <div id="resultView" class="view-container">
        <div class="result-card">
            <div class="action-bar">
                <button id="backBtn" class="btn btn-outline">← 返回查詢</button>
                <button id="printBtn" class="btn btn-secondary">列印課表</button>
            </div>

            <div class="title-header-container">
                <h2 id="scheduleTitle" class="schedule-title">課表名稱</h2>
                <div id="homeroomTeacherInfo" class="homeroom-teacher-info hidden"></div>
            </div>

            <div id="scheduleTableContainer" class="table-responsive">
                <!-- 動態繪製課表表格 -->
            </div>
        </div>
    </div>

    <!-- 代課 Modal -->
    <div id="substituteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>選擇代課教師</h3>
                <button id="closeModalBtn" class="modal-close">&times;</button>
            </div>
            <div id="modalBody" class="modal-body">
                <!-- 動態注入空堂教師列表 -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
