<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課表查詢系統 - 民雄國中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 全螢幕資料載入遮罩 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div id="loadingText">系統資料載入中，請稍候...</div>
    </div>

    <!-- 1. 密碼驗證視圖 -->
    <div id="loginView" class="view-container active">
        <div class="login-card">
            <h1 class="system-title">民雄國中課表查詢系統</h1>
            <p class="system-subtitle">請輸入系統密碼以繼續使用</p>
            
            <div class="form-group">
                <input type="password" id="passwordInput" class="form-control" placeholder="請輸入密碼" autocomplete="current-password">
                <div id="loginError" class="error-msg"></div>
            </div>
            
            <button id="loginBtn" class="btn btn-primary btn-block">登入系統</button>

            <!-- 瀏覽計數器展示區塊 -->
            <div class="counter-footer">
                <div class="counter-badge">
                    <span>當月瀏覽:</span>
                    <span id="monthCounter" class="count-num">--</span> 次
                </div>
                <div class="counter-badge">
                    <span>累計瀏覽:</span>
                    <span id="totalCounter" class="count-num">--</span> 次
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 課表查詢主頁面視圖 -->
    <div id="queryView" class="view-container">
        <div class="query-card">
            <div class="header-bar">
                <span id="semesterBadge" class="semester-badge">載入中...</span>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">登出系統</button>
            </div>

            <!-- Tab 切換頁籤 -->
            <div class="tab-header">
                <button class="tab-btn active" data-tab="classTab">班級課表</button>
                <button class="tab-btn" data-tab="teacherTab">教師課表</button>
                <button class="tab-btn" data-tab="classroomTab">專科教室</button>
            </div>

            <!-- Tab 內容 1：班級課表 -->
            <div id="classTab" class="tab-content active">
                <div class="query-grid">
                    <div class="form-group">
                        <label class="grade-label grade-7">七年級</label>
                        <select id="grade7Select" class="form-control class-select">
                            <option value="">請選擇班級</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="grade-label grade-8">八年級</label>
                        <select id="grade8Select" class="form-control class-select">
                            <option value="">請選擇班級</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="grade-label grade-9">九年級</label>
                        <select id="grade9Select" class="form-control class-select">
                            <option value="">請選擇班級</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="grade-label grade-special">特殊班級</label>
                        <select id="gradeSpecialSelect" class="form-control class-select">
                            <option value="">請選擇班級</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tab 內容 2：教師課表 -->
            <div id="teacherTab" class="tab-content hidden">
                <div class="query-grid-2">
                    <div class="form-group">
                        <label for="teacherSelect">選擇教師</label>
                        <select id="teacherSelect" class="form-control">
                            <option value="">請選擇教師</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tab 內容 3：專科教室課表 -->
            <div id="classroomTab" class="tab-content hidden">
                <div class="query-grid-2">
                    <div class="form-group">
                        <label for="classroomSelect">選擇專科教室</label>
                        <select id="classroomSelect" class="form-control">
                            <option value="">請選擇教室</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 課表結果展示視圖 -->
    <div id="resultView" class="view-container">
        <div class="result-card">
            <!-- 頂部操作列 -->
            <div class="action-bar">
                <button id="backBtn" class="btn btn-secondary">← 返回查詢</button>
                <button id="printBtn" class="btn btn-outline">列印課表</button>
            </div>

            <!-- 標題與導師資訊容器 -->
            <div class="title-header-container">
                <h2 id="scheduleTitle" class="schedule-title">課表名稱</h2>
                <div id="homeroomTeacherInfo" class="homeroom-teacher-info hidden"></div>
            </div>

            <!-- 課表表格容器 -->
            <div id="scheduleTableContainer" class="table-responsive">
                <!-- 動態繪製課表 Table -->
            </div>
        </div>
    </div>

    <!-- 代課教師彈出視窗 (Modal) -->
    <div id="substituteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">無課教師推薦</h3>
                <button id="modalCloseBtn" class="modal-close">&times;</button>
            </div>
            <div id="modalBody" class="modal-body">
                <!-- 動態注入同科目/其他科目無課教師按鈕 -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
